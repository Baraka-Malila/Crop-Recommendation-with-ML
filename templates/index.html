<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Crop Recommendation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
  </head>
  <style>
    * {
      font-family: 'Poppins', sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px 0;
    }
    
    .main-container {
      max-width: 900px;
      margin: 0 auto;
    }
    
    .header {
      text-align: center;
      margin-bottom: 40px;
      color: white;
    }
    
    .header h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    
    .header p {
      font-size: 1.2rem;
      opacity: 0.9;
      font-weight: 300;
    }
    
    .form-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }
    
    .input-group {
      margin-bottom: 25px;
    }
    
    .input-group label {
      color: #2c3e50;
      font-weight: 500;
      margin-bottom: 8px;
      display: block;
      font-size: 1rem;
    }
    
    .form-control {
      border: 2px solid #e3f2fd;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: #f8f9ff;
    }
    
    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
      background: white;
    }
    
    .input-icon {
      color: #667eea;
      margin-right: 8px;
    }
    
    .submit-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 50px;
      padding: 15px 50px;
      font-size: 1.1rem;
      font-weight: 600;
      color: white;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }
    
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(102, 126, 234, 0.4);
      background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
    }
    
    .result-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: none;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      overflow: hidden;
      margin: 30px auto;
      max-width: 500px;
      animation: slideUp 0.6s ease-out;
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .result-card .card-header {
      background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
      color: white;
      padding: 20px;
      font-weight: 600;
      font-size: 1.2rem;
      border: none;
    }
    
    .result-card .card-body {
      padding: 30px;
      text-align: center;
    }
    
    .crop-result {
      font-size: 1.4rem;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 15px;
    }
    
    .crop-icon {
      font-size: 4rem;
      color: #4CAF50;
      margin-bottom: 20px;
    }
    
    .parameter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    @media (max-width: 768px) {
      .header h1 {
        font-size: 2rem;
      }
      
      .form-container {
        margin: 0 15px;
        padding: 25px;
      }
      
      .parameter-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <body>
    <div class="main-container">
      <!-- Header Section -->
      <div class="header">
        <h1><i class="fas fa-seedling"></i> Smart Crop Recommendation</h1>
        <p>Discover the perfect crop for your soil and weather conditions</p>
      </div>

      <!-- Form Section -->
      <div class="form-container">
        <form action="/predict" method="POST">
          <div class="parameter-grid">
            <!-- Soil Parameters -->
            <div class="input-group">
              <label for="Nitrogen">
                <i class="fas fa-flask input-icon"></i>Nitrogen (N)
              </label>
              <input type="number" name="Nitrogen" id="Nitrogen" 
                     placeholder="Enter nitrogen content" 
                     class="form-control" required>
            </div>
            
            <div class="input-group">
              <label for="Phosphorus">
                <i class="fas fa-atom input-icon"></i>Phosphorus (P)
              </label>
              <input type="number" name="Phosphorus" id="Phosphorus" 
                     placeholder="Enter phosphorus content" 
                     class="form-control" required>
            </div>
            
            <div class="input-group">
              <label for="Potassium">
                <i class="fas fa-fire input-icon"></i>Potassium (K)
              </label>
              <input type="number" name="Potassium" id="Potassium" 
                     placeholder="Enter potassium content" 
                     class="form-control" required>
            </div>
            
            <!-- Environmental Parameters -->
            <div class="input-group">
              <label for="Temperature">
                <i class="fas fa-thermometer-half input-icon"></i>Temperature (°C)
              </label>
              <input type="number" step="0.01" name="Temperature" id="Temperature" 
                     placeholder="Enter temperature" 
                     class="form-control" required>
            </div>
            
            <div class="input-group">
              <label for="Humidity">
                <i class="fas fa-tint input-icon"></i>Humidity (%)
              </label>
              <input type="number" step="0.01" name="Humidity" id="Humidity" 
                     placeholder="Enter humidity level" 
                     class="form-control" required>
            </div>
            
            <div class="input-group">
              <label for="pH">
                <i class="fas fa-vial input-icon"></i>pH Level
              </label>
              <input type="number" step="0.01" name="pH" id="pH" 
                     placeholder="Enter pH value (0-14)" 
                     class="form-control" required>
            </div>
            
            <div class="input-group">
              <label for="Rainfall">
                <i class="fas fa-cloud-rain input-icon"></i>Rainfall (mm)
              </label>
              <input type="number" step="0.01" name="Rainfall" id="Rainfall" 
                     placeholder="Enter annual rainfall" 
                     class="form-control" required>
            </div>
          </div>
          
          <div class="text-center">
            <div class="loading" id="loadingDiv">
              <div class="loading-spinner"></div>
              <p>Analyzing your data...</p>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">
              <i class="fas fa-search"></i> Get Crop Recommendation
            </button>
          </div>
        </form>
      </div>

      <!-- Result Section -->
      {% if result %}
      <div class="result-card">
        <div class="card-header">
          <i class="fas fa-check-circle"></i> Recommendation Result
        </div>
        <div class="card-body">
          <div class="crop-icon">
            <i class="fas fa-leaf"></i>
          </div>
          <div class="crop-result">{{ result }}</div>
          <small class="text-muted">Based on your soil and environmental conditions</small>
        </div>
      </div>
      {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Form submission with loading state
        document.querySelector('form').addEventListener('submit', function(e) {
            const submitBtn = document.getElementById('submitBtn');
            const loadingDiv = document.getElementById('loadingDiv');
            
            submitBtn.style.display = 'none';
            loadingDiv.style.display = 'block';
        });

        // Input validation and formatting
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('input[type="number"]');
            
            inputs.forEach(input => {
                input.addEventListener('input', function() {
                    // Remove any non-numeric characters except decimal point and minus
                    this.value = this.value.replace(/[^0-9.-]/g, '');
                    
                    // Add visual feedback for valid input
                    if (this.value && !isNaN(this.value)) {
                        this.style.borderColor = '#4CAF50';
                    } else {
                        this.style.borderColor = '#e3f2fd';
                    }
                });
                
                // Add focus and blur effects
                input.addEventListener('focus', function() {
                    this.parentElement.style.transform = 'translateY(-2px)';
                });
                
                input.addEventListener('blur', function() {
                    this.parentElement.style.transform = 'translateY(0)';
                });
            });
        });

        // Add some animation on page load
        window.addEventListener('load', function() {
            const formContainer = document.querySelector('.form-container');
            formContainer.style.opacity = '0';
            formContainer.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                formContainer.style.transition = 'all 0.6s ease';
                formContainer.style.opacity = '1';
                formContainer.style.transform = 'translateY(0)';
            }, 200);
        });
    </script>
  </body>
</html>
